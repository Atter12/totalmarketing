<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Admin — Leads Holistic Marketing</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%;background:#030508;color:#e8ecf1;font-family:'Inter',system-ui,sans-serif}
  :root{
    --cyan:#3FF8E3;--pink:#ff5b86;--line:rgba(63,248,227,.2);
    --card:#0c1018;--muted:#8b95a5;
  }
  .top{
    padding:20px 24px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(63,248,227,.06),transparent);
  }
  .top-inner{max-width:1400px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
  h1{font-size:clamp(20px,3vw,26px);font-weight:800}
  h1 span{background:linear-gradient(135deg,var(--cyan),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
  .auth{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .auth input{
    padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:#060a10;color:#fff;
    min-width:220px;font-size:14px;
  }
  .auth button,.btn{
    padding:10px 18px;border-radius:10px;border:none;font-weight:700;cursor:pointer;font-size:14px;
    background:linear-gradient(180deg,#7afff0,var(--cyan));color:#001b18;
    box-shadow:0 8px 24px rgba(63,248,227,.25);
  }
  .btn-ghost{background:transparent;color:var(--cyan);border:1px solid var(--line);box-shadow:none}
  main{max-width:1400px;margin:0 auto;padding:24px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px}
  .stat{
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px;
    box-shadow:0 0 40px rgba(63,248,227,.06);
  }
  .stat label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
  .stat b{font-size:26px;font-weight:800;background:linear-gradient(135deg,#fff,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;align-items:center}
  .toolbar input{
    flex:1;min-width:200px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:#060a10;color:#fff;font-size:14px;
  }
  .table-wrap{
    overflow:auto;border-radius:14px;border:1px solid var(--line);
    background:var(--card);box-shadow:0 24px 80px rgba(0,0,0,.45);
  }
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:12px 14px;text-align:left;border-bottom:1px solid rgba(255,255,255,.06)}
  th{
    font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;
    background:rgba(63,248,227,.04);position:sticky;top:0;
  }
  tr:hover td{background:rgba(63,248,227,.04)}
  .pill{display:inline-flex;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700}
  .pill-yes{background:rgba(25,195,125,.15);color:#5ee9a8;border:1px solid rgba(25,195,125,.35)}
  .pill-no{background:rgba(255,43,94,.12);color:#ff8fa8;border:1px solid rgba(255,43,94,.35)}
  .empty{padding:48px;text-align:center;color:var(--muted)}
  .err{color:#ff8fa8;font-size:14px;margin-top:8px}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <h1>Dashboard <span>Leads</span> · Holistic Marketing</h1>
    <div class="auth">
      <input type="password" id="adminKey" placeholder="Clave admin (ADMIN_KEY en Vercel)" autocomplete="off" />
      <button type="button" id="connectBtn">Conectar</button>
      <button type="button" class="btn-ghost" id="refreshBtn" disabled>Actualizar</button>
    </div>
  </div>
</header>
<main>
  <div class="stats" id="stats" hidden>
    <div class="stat"><label>Total registros</label><b id="stTotal">0</b></div>
    <div class="stat"><label>Calificados</label><b id="stOk">0</b></div>
    <div class="stat"><label>No calificados</label><b id="stNo">0</b></div>
    <div class="stat"><label>Promedio puntos</label><b id="stAvg">0</b></div>
  </div>
  <div class="toolbar">
    <input type="search" id="filter" placeholder="Filtrar por nombre, email, WhatsApp…" disabled />
  </div>
  <p class="err" id="errMsg" hidden></p>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Nombre</th>
          <th>Email</th>
          <th>WhatsApp</th>
          <th>País</th>
          <th>Calif.</th>
          <th>Puntos</th>
          <th>Presupuesto</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="8" class="empty">Introduce la clave admin y pulsa Conectar.</td></tr>
      </tbody>
    </table>
  </div>
</main>
<script>
(function(){
  const KEY_STORAGE = 'hm_admin_key_v1';
  const $ = (id)=>document.getElementById(id);

  let rows = [];

  function fmtDate(iso){
    if(!iso) return '—';
    try{
      const d = new Date(iso);
      return d.toLocaleString('es-LA',{ dateStyle:'short', timeStyle:'short' });
    }catch(_){ return iso; }
  }

  function render(){
    const q = ($('filter').value || '').trim().toLowerCase();
    const filtered = !q ? rows : rows.filter(r=>{
      const blob = [r.nombre,r.apellido,r.email,r.whatsapp,r.country,r.presupuesto].filter(Boolean).join(' ').toLowerCase();
      return blob.includes(q);
    });

    const tb = $('tbody');
    if(!filtered.length){
      tb.innerHTML = '<tr><td colspan="8" class="empty">Sin resultados.</td></tr>';
      return;
    }
    tb.innerHTML = filtered.map(r=>{
      const ok = r.calificado === true;
      return `<tr>
        <td>${fmtDate(r.created_at)}</td>
        <td>${escapeHtml([r.nombre,r.apellido].filter(Boolean).join(' ')||'—')}</td>
        <td>${escapeHtml(r.email||'—')}</td>
        <td>${escapeHtml([r.country,r.whatsapp].filter(Boolean).join(' ')||'—')}</td>
        <td>${escapeHtml(r.country||'—')}</td>
        <td><span class="pill ${ok?'pill-yes':'pill-no'}">${ok?'Apto':'No'}</span></td>
        <td>${r.puntos ?? '—'}</td>
        <td>${escapeHtml(r.presupuesto||'—')}</td>
      </tr>`;
    }).join('');
  }

  function escapeHtml(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function stats(){
    const n = rows.length;
    const ok = rows.filter(r=>r.calificado===true).length;
    const no = n - ok;
    const sum = rows.reduce((a,r)=>a+(Number(r.puntos)||0),0);
    const avg = n ? (sum/n).toFixed(1) : '0';
    $('stTotal').textContent = n;
    $('stOk').textContent = ok;
    $('stNo').textContent = no;
    $('stAvg').textContent = avg;
    $('stats').hidden = false;
  }

  async function load(){
    const key = $('adminKey').value.trim() || sessionStorage.getItem(KEY_STORAGE);
    if(!key){ $('errMsg').hidden = false; $('errMsg').textContent = 'Introduce la clave admin.'; return; }
    sessionStorage.setItem(KEY_STORAGE, key);
    $('errMsg').hidden = true;
    $('connectBtn').disabled = true;
    try{
      const res = await fetch('/api/leads', { headers:{ 'x-admin-key': key } });
      const data = await res.json().catch(()=>({}));
      if(!res.ok) throw new Error(data.error || 'Error');
      rows = data.leads || [];
      stats();
      $('filter').disabled = false;
      $('refreshBtn').disabled = false;
      render();
    }catch(e){
      $('errMsg').hidden = false;
      $('errMsg').textContent = 'No autorizado o error al cargar. Revisa ADMIN_KEY en Vercel y la tabla `leads`.';
      $('tbody').innerHTML = '<tr><td colspan="8" class="empty">Sin datos.</td></tr>';
    }
    $('connectBtn').disabled = false;
  }

  $('connectBtn').addEventListener('click', load);
  $('refreshBtn').addEventListener('click', load);
  $('filter').addEventListener('input', render);

  const saved = sessionStorage.getItem(KEY_STORAGE);
  if(saved){ $('adminKey').value = saved; }
})();
</script>
</body>
</html>
